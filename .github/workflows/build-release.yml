name: Build and Release

permissions:
  id-token: write
  contents: write
  packages: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'design.md'
      # SDD artifacts. These change on every spec/plan/review cycle and never
      # affect the binary, so they must not cut a release or push an image.
      # All of them live under docs/ (specs, plans, decisions, summaries).
      - 'CLAUDE.md'
      - 'vega.yaml'
      - 'docs/**'
      - 'TODO.md'
      # The image harness never affects the binary.
      - 'tests/e2e/**'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1: Checkout code (required before using the action)
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all the history for GitVersion
          persist-credentials: true

      # 2: Set up Go for the test run
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # 3: Install kustomize AND helm, both required by the integration tests.
      # Keep these in sync with the Dockerfile so the tests run against the same
      # versions the released image ships.
      #
      # helm is not optional here: the integration harness builds with
      # --enable-helm, and the helmCharts values-file scenario skips itself
      # without it. A skipped test still reports `ok`, which is precisely the
      # silent-skip CLAUDE.md forbids.
      - name: Install kustomize and helm
        env:
          KUSTOMIZE_VERSION: v5.8.1
          HELM_VERSION: v4.2.4
        run: |
          curl -sfL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin
          kustomize version

          curl -sfL -o /tmp/helm.tar.gz \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      # 4: Run tests before tagging or releasing anything.
      # Fail if any test skipped: a silent skip means a scenario CI believes it
      # covers was never actually run (CLAUDE.md, NF-09).
      - name: Run tests
        run: |
          go test ./... -count=1 -v 2>&1 | tee /tmp/test.log
          if grep -q '^--- SKIP' /tmp/test.log; then
            echo "::error::A test skipped. CI must run every scenario; see CLAUDE.md."
            grep '^--- SKIP' /tmp/test.log
            exit 1
          fi

      # 5: Call our custom `GitVersion action` to tag the repo
      - name: Tag with GitVersion
        id: gitversion
        uses: michielvha/gitversion-tag-action@v6
        with:
          configFilePath: gitversion.yml

      # 6: Use the custom build-release action
      - name: Build and Release Go Binary
        uses: michielvha/goreleaser-action@main
        with:
          # Must match the go directive in go.mod. The action defaults to an
          # older Go and sets GOTOOLCHAIN=local, so it cannot self-upgrade: a
          # go.mod requiring a newer toolchain fails the build outright rather
          # than downloading one.
          go-version: '1.26.6'
          github-token: ${{ github.token }}
          pgp-private-key: ${{ secrets.PGP_PRIVATE_KEY }}

      # 7: Build and Push Docker image
      - name: Build and Push Docker Image
        uses: michielvha/docker-release-action@main
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          project: 'kustomize-build-check'
          version: ${{ steps.gitversion.outputs.semVer }}
          platforms: 'linux/amd64,linux/arm64'
          context: '.'
